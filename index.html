    * {

    body {

    /* Tarjeta */
    .card {
      position: relative;
      width: 300px;
      max-width: 90%; /* responsive */
      
      border-radius: 5px;
      overflow: hidden;
      transition: .5s;
      margin: 15px 20px;
      font-family: 'Shadows Into Light',
    }

    /* Primera capa de fondo */
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: url("https://i.ibb.co/60BXMxCQ/depositphotos-69557169-stock-photo-dj-mixer-with-light-colored.webp") no-repeat center center;
      background-size: cover;
      animation: mover1 5s infinite linear;
      z-index: -2;
    }

   

    @keyframes mover1 {
      0%   { transform: scale(1) translate(0,0); }
      50%  { transform: scale(1.1) translate(-20px, -10px); }
      100% { transform: scale(1) translate(0,0); }
    }

    @keyframes mover2 {
      0%   { transform: scale(1) translate(0,0); }
      50%  { transform: scale(1.1) translate(20px, 15px); }
      100% { transform: scale(1) translate(0,0); }
    }

    .card:hover {
      box-shadow: 0 5px 10px rgba(0,0,0,1);
      transform: translateY(-20px);
    }

    /* Encabezado */
    .card .head {
      height: 125px;
      width: 100%;
      position: relative;
    }

  

.logo-container {

  <script>//efecto matrix h2
function prepararMatrixTexto() {
    const p = document.getElementById('matrix-text');
    if (!p) return;

    const texto = p.getAttribute('data-text');
    p.textContent = ''; // limpiar contenido

    // Crear spans para cada letra con retraso aleatorio
    for (let i = 0; i < texto.length; i++) {
      const span = document.createElement('span');
      span.textContent = texto[i];
      // Retraso aleatorio entre 0 y 1.5 segundos
      const delay = (Math.random() * 1.5).toFixed(2);
      span.style.animationDelay = `${delay}s`;
      p.appendChild(span);
    }
  }

  // Ejecutar al cargar
  prepararMatrixTexto();
  
  
  function playAndGo(audioId, url, delay) {
    const audio = document.getElementById(audioId);
    if (audio) {
      // reproducir el audio
      audio.play().catch(err => {
        console.log("Error al reproducir:", err);
        // si falla, abrir directo
        window.location.href = url;
      });
    }

    // después del tiempo indicado, abrir el catálogo
    setTimeout(() => {
      window.location.href = url;
    }, delay);
  }
